    <script>
        window.addEventListener('load', function () {
            const loader = document.getElementById('loading-screen');

            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.transition = 'opacity 0.5s ease';

                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            }, 1500); // 1.5 seconds delay
        });
    </script>



    <script>
        function updateDailyDrink() {
            const allDrinks = [
                // Milk Teas
                "Classic Milk Tea", "Coconut Milk Tea", "Coffee Milk Tea", "Taro Milk Tea",
                "Jasmine Milk Tea", "Honeydew Milk Tea", "Matcha Latte", "Thai Tea",
                "Lavender Milk Tea", "Banana Milk Tea", "Vanilla Milk Tea", "Magic Mocha",
                "Chocolate Milk Tea", "Strawberry Milk Tea", "Mango Milk Tea",
                "Pina Colada Milk Tea", "Pineapple Milk Tea", "Pumpkin Spice Milk Tea",
                "Gingerbread Milk Tea", "Peppermint Milk Tea",
                // Fruit Tea / Lemonade
                "Lychee Fruit Tea", "Mango Fruit Tea", "Passionfruit Fruit Tea", "Peach Fruit Tea",
                "Pineapple Fruit Tea", "Raspberry Fruit Tea", "Strawberry Fruit Tea", "Blueberry Fruit Tea",
                "Lavender Fruit Tea", "Honeydew Fruit Tea", "Grapefruit Fruit Tea", "Butterfly Pea Lemonade",
                "Watermelon Lemonade", "Black Cherry Lemonade",
                // Slush
                "Mango Slush", "Passionfruit Slush", "Peach Slush", "Strawberry Slush",
                // Milkshakes
                "Strawberry Milkshake", "Mango Milkshake", "Peach Milkshake", "Nutella Milkshake",
                "Vanilla Milkshake", "Pineapple Milkshake", "M & M Milkshake", "Oreo Milkshake", "Butterfinger Milkshake",
                // Brown Sugar Marble
                "Brown Sugar Marble Milk", "Brown Sugar Marble Milk Tea", "Brown Sugar Matcha Latte",
                "Strawberry Marble Milk", "Mango Marble Milk",
                // Smoothies
                "Strawberry Smoothie", "Banana Smoothie", "Double Berry Smoothie",
                "Pineapple Smoothie", "Watermelon Smoothie", "Dragonfruit Smoothie"
            ];

            // Logic for UTC-05:00 (EST)
            const now = new Date();
            const utcOffset = now.getTime() + (now.getTimezoneOffset() * 60000);
            const estTime = new Date(utcOffset - (3600000 * 5));

            // Get a unique index based on the date
            const dayTimestamp = Math.floor(estTime.getTime() / 86400000);
            const selection = allDrinks[dayTimestamp % allDrinks.length];

            document.getElementById('drink-name').innerText = selection;
        }

        updateDailyDrink();
    </script>
